<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitLog</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- ================= HEADER ================= -->

<header>

    <h1>FitLog</h1>

    <p>Fitness Management System</p>

</header>


<main>


    <!-- =================================================
         USER
    ================================================== -->

    <section class="card">

        <h2>User Details</h2>


        <form id="userForm">

            <input type="hidden"
                   id="userId">


            <div class="form-grid">

                <input type="text"
                       id="userName"
                       placeholder="Name"
                       required>


                <input type="email"
                       id="userEmail"
                       placeholder="Email"
                       required>


                <input type="number"
                       id="userAge"
                       placeholder="Age"
                       required>


                <input type="number"
                       step="0.01"
                       id="userWeight"
                       placeholder="Weight"
                       required>


                <select id="userGender"
                        required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input type="date"
                       id="userDate"
                       required>

            </div>


            <button type="submit"
                    id="userButton">

                Add User

            </button>


            <button type="button"
                    class="cancel"
                    onclick="clearUserForm()">

                Cancel

            </button>

        </form>


        <!-- USER TABLE -->

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Age</th>

                    <th>Weight</th>

                    <th>Gender</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="userTable">

                </tbody>

            </table>

        </div>

    </section>



    <!-- =================================================
         WORKOUT
    ================================================== -->

    <section class="card">

        <h2>Workout Details</h2>


        <form id="workoutForm">

            <input type="hidden"
                   id="workoutId">


            <div class="form-grid">

                <input type="number"
                       id="duration"
                       placeholder="Duration"
                       required>


                <input type="number"
                       step="0.01"
                       id="caloriesburnt"
                       placeholder="Calories Burnt"
                       required>


                <input type="text"
                       id="wktype"
                       placeholder="Workout Type"
                       required>

            </div>


            <button type="submit"
                    id="workoutButton">

                Add Workout

            </button>


            <button type="button"
                    class="cancel"
                    onclick="clearWorkoutForm()">

                Cancel

            </button>

        </form>


        <!-- WORKOUT TABLE -->

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Duration</th>

                    <th>Calories Burnt</th>

                    <th>Workout Type</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="workoutTable">

                </tbody>

            </table>

        </div>

    </section>



    <!-- =================================================
         MEAL
    ================================================== -->

    <section class="card">

        <h2>Meal Details</h2>


        <form id="mealForm">

            <input type="hidden"
                   id="mealId">


            <div class="form-grid">

                <input type="number"
                       step="0.01"
                       id="carb"
                       placeholder="Carbohydrates"
                       required>


                <input type="number"
                       step="0.01"
                       id="protein"
                       placeholder="Protein"
                       required>


                <input type="number"
                       step="0.01"
                       id="fibre"
                       placeholder="Fibre"
                       required>


                <input type="number"
                       step="0.01"
                       id="intakecalories"
                       placeholder="Intake Calories"
                       required>

            </div>


            <button type="submit"
                    id="mealButton">

                Add Meal

            </button>


            <button type="button"
                    class="cancel"
                    onclick="clearMealForm()">

                Cancel

            </button>

        </form>


        <!-- MEAL TABLE -->

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Carb</th>

                    <th>Protein</th>

                    <th>Fibre</th>

                    <th>Intake Calories</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="mealTable">

                </tbody>

            </table>

        </div>

    </section>



    <!-- =================================================
         GOAL
    ================================================== -->

    <section class="card">

        <h2>Goal Details</h2>


        <form id="goalForm">

            <input type="hidden"
                   id="goalId">


            <div class="form-grid">

                <input type="number"
                       step="0.01"
                       id="Gweight"
                       placeholder="Goal Weight"
                       required>


                <input type="text"
                       id="period"
                       placeholder="Period"
                       required>


                <input type="number"
                       step="0.01"
                       id="pweight"
                       placeholder="Present Weight"
                       required>


                <input type="number"
                       step="0.01"
                       id="Rweight"
                       placeholder="Required Weight"
                       required>

            </div>


            <button type="submit"
                    id="goalButton">

                Add Goal

            </button>


            <button type="button"
                    class="cancel"
                    onclick="clearGoalForm()">

                Cancel

            </button>

        </form>


        <!-- GOAL TABLE -->

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Goal Weight</th>

                    <th>Period</th>

                    <th>Present Weight</th>

                    <th>Required Weight</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="goalTable">

                </tbody>

            </table>

        </div>

    </section>


</main>


<script src="script.js"></script>

</body>

</html>
